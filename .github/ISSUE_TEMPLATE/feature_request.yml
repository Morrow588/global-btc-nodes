name: Feature request
description: Propose a capability, dataset field, or strategy the toolkit should support.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        A good feature request describes the problem, not just the solution.
        If you plan to implement it yourself, say so — it changes the review path.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you are in that the toolkit does not currently handle.
      placeholder: "I want to evaluate a strategy against realistic fees, but the backtest layer has no cost model."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the interface if you have one in mind.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Data ingestion (Bitcoin node RPC or market data)
        - Dataset schema or validation
        - Research / notebooks and experiment runner
        - Strategy layer (signals, backtests, paper trading)
        - Documentation and contributor experience
        - CI, tooling or dependencies
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, including doing nothing.
    validations:
      required: false

  - type: checkboxes
    id: honesty
    attributes:
      label: A note on claims
      options:
        - label: Any performance numbers I mention are measured or clearly labelled as illustrative.
          required: true
        - label: I understand unreleased work is described as planned in the docs, not as working.
          required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
