name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repository health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Installing the pinned dependency set proves it resolves on a clean
      # machine, which is what a new contributor and the data pipeline both do.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scripts compile
        run: python -m compileall -q scripts

      - name: Test data validation and atomic writes (offline)
        run: python -m unittest discover -s tests -v

      - name: Check repository health (community files, README, CI wiring)
        run: python scripts/check_repo.py

      # Re-derives the committed baseline from the committed dataset and compares
      # it with results/baseline_results.json. Offline by design: the dataset is in
      # the repository, so a green run here proves a clean clone reproduces it.
      - name: Verify the committed baseline reproduces
        run: python scripts/run_baseline.py --check
