name: Auto-update BTC dataset

# One job, one purpose: fetch live Bitcoin network telemetry and BTC-USD market
# data, validate it, and commit it *only if the numbers actually moved*. The
# commits this workflow produces are the dataset itself -- never a heartbeat,
# never an empty "keep the workflow alive" commit. If the fetch or the
# validation fails, the job fails and the last good dataset stays exactly as it
# was, which is the point: a red run is information, a silent no-op is not.

on:
  schedule:
    # 05:17 UTC daily. Deliberately after the UTC day boundary so yesterday's
    # daily candle is closed and can be appended as a finished bar.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# data/btc_market_daily.csv is an append-only file; two overlapping runs would
# race each other on the same rows and produce a conflicting commit.
concurrency:
  group: auto-update-btc-dataset
  cancel-in-progress: false

jobs:
  update-dataset:
    name: Fetch live BTC network + market data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validates before writing: on a malformed payload this step exits
      # non-zero and no tracked file is modified. It also writes the commit
      # message, which names the real observed values.
      - name: Fetch and validate live data
        run: python scripts/fetch_data.py --summary-file "$RUNNER_TEMP/commit-message.txt"

      - name: Check the dataset that was just written
        run: python scripts/check_repo.py

      - name: Commit and push only if the dataset changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Dataset is already up to date for today -- nothing to commit."
            exit 0
          fi
          echo "Committing:"
          cat "$RUNNER_TEMP/commit-message.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
